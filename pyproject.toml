[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browserview"
version = "0.3.1"
description = "Python client for the browserview.io API - disposable cloud browser sessions with a live viewer and CDP access."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BrowserView" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.24"]
keywords = ["browser", "cdp", "chromium", "playwright", "browserview"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://browserview.io"
Documentation = "https://browserview.io/docs/sdks"
Source = "https://github.com/browserview/python"
Issues = "https://github.com/browserview/python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/browserview"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]
exclude = ["**/__pycache__", "**/.pytest_cache"]
